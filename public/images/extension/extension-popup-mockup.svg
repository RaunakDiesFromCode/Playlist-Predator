<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="100%" height="100%" fill="none" style="background:#09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif;">
  <defs>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Centered Popup Container -->
  <g transform="translate(100, 20)" filter="url(#shadowBox)">
    <!-- Main Window Background (380px wide matching extension width) -->
    <rect width="400" height="580" fill="#09090b" stroke="#27272a" stroke-width="1.5" />

    <!-- Top window titlebar -->
    <rect width="400" height="34" fill="#141416" stroke="#27272a" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="17" r="4.5" fill="#eab308" />
    <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
    <text x="200" y="22" fill="#71717a" font-size="11" font-weight="500" text-anchor="middle">Chrome Extension Popup</text>

    <!-- Header Section -->
    <g transform="translate(20, 50)">
      <!-- Logo box -->
      <rect width="36" height="36" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="18" y="24" fill="#22c55e" font-size="16" font-weight="900" text-anchor="middle">P</text>

      <text x="46" y="16" fill="#fafafa" font-size="14" font-weight="700">Playlist Predator</text>
      <text x="46" y="32" fill="#71717a" font-size="11">YouTube Sync</text>

      <!-- Connected status pill -->
      <g transform="translate(250, 6)">
        <rect width="110" height="24" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.75" />
        <circle cx="14" cy="12" r="3.5" fill="#22c55e" />
        <text x="60" y="16" fill="#22c55e" font-size="11" font-weight="600" text-anchor="middle">Connected</text>
      </g>
    </g>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#27272a" stroke-width="1" />

    <!-- Card 1: Account -->
    <g transform="translate(20, 115)">
      <rect width="360" height="66" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="22" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">ACCOUNT</text>
      
      <circle cx="24" cy="45" r="9" fill="#27272a" />
      <text x="24" y="49" fill="#a1a1aa" font-size="10" text-anchor="middle">👤</text>
      <text x="42" y="49" fill="#e4e4e7" font-size="12" font-weight="600">developer@example.com</text>
      
      <rect x="290" y="38" width="56" height="18" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.5" />
      <text x="318" y="50" fill="#22c55e" font-size="9" font-weight="700" text-anchor="middle">LINKED</text>
    </g>

    <!-- Card 2: Active Playlist Section -->
    <g transform="translate(20, 195)">
      <rect width="360" height="180" fill="#18181b" stroke="#27272a" stroke-width="1" />
      
      <text x="14" y="24" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">ACTIVE PLAYLIST</text>
      <rect x="295" y="12" width="52" height="18" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.5" />
      <text x="321" y="24" fill="#22c55e" font-size="9" font-weight="700" text-anchor="middle">SYNC ON</text>

      <text x="14" y="52" fill="#fafafa" font-size="14" font-weight="700">Next.js 15 App Router Mastery</text>
      
      <!-- Meta details -->
      <rect x="14" y="65" width="125" height="20" fill="#09090b" stroke="#27272a" stroke-width="1" />
      <text x="76" y="79" fill="#71717a" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">PLxyz98741029</text>

      <text x="150" y="79" fill="#22c55e" font-size="11" font-weight="600">18 / 32 done (56%)</text>

      <!-- Progress bar -->
      <rect x="14" y="96" width="332" height="6" fill="#27272a" />
      <rect x="14" y="96" width="186" height="6" fill="#22c55e" />

      <!-- Open Button -->
      <rect x="14" y="118" width="332" height="40" fill="#09090b" stroke="#3f3f46" stroke-width="1" />
      <text x="180" y="143" fill="#e4e4e7" font-size="12" font-weight="600" text-anchor="middle">Open in Playlist Predator ↗</text>
    </g>

    <!-- Card 3: Current Tab Status -->
    <g transform="translate(20, 390)">
      <rect width="360" height="74" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="22" fill="#71717a" font-size="10" font-weight="700" letter-spacing="0.5">CURRENT YOUTUBE TAB</text>
      <circle cx="22" cy="45" r="4" fill="#ef4444" />
      <text x="34" y="47" fill="#fafafa" font-size="12" font-weight="500">Lesson #19: Server Actions in Depth</text>
      <text x="34" y="62" fill="#22c55e" font-size="10" font-weight="600">89% watched • Auto-Done triggered ✓</text>
    </g>

    <!-- Footer: Controls -->
    <g transform="translate(20, 485)">
      <line x1="0" y1="0" x2="360" y2="0" stroke="#27272a" stroke-width="1" />
      <text x="10" y="32" fill="#71717a" font-size="11">Playlist Predator</text>
      
      <rect x="240" y="14" width="110" height="28" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="295" y="32" fill="#e4e4e7" font-size="11" font-weight="600" text-anchor="middle">Sync Now ↻</text>
    </g>
  </g>
</svg>
