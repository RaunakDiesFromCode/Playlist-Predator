<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" fill="none" style="background:#09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif;">
  <defs>
    <filter id="stepShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="40" y="44" fill="#fafafa" font-size="16" font-weight="700" letter-spacing="1">CHROME INSTALLATION IN 3 QUICK STEPS</text>
  <text x="40" y="66" fill="#71717a" font-size="12">Works with Chrome, Edge, Brave, Arc, Opera, and any Chromium-based browser.</text>

  <!-- Step 1 Card -->
  <g transform="translate(40, 95)" filter="url(#stepShadow)">
    <rect width="275" height="240" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="275" height="40" fill="#141416" stroke="#27272a" stroke-width="1" />
    <circle cx="24" cy="20" r="12" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
    <text x="24" y="25" fill="#22c55e" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="46" y="25" fill="#fafafa" font-size="13" font-weight="700">Developer Mode</text>

    <!-- Visual illustration of URL & Toggle -->
    <rect x="18" y="55" width="239" height="36" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <text x="30" y="77" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace">chrome://extensions</text>

    <!-- Toggle representation -->
    <rect x="18" y="105" width="239" height="50" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <text x="30" y="134" fill="#e4e4e7" font-size="12" font-weight="600">Developer mode</text>
    
    <!-- Active switch -->
    <rect x="195" y="121" width="38" height="18" rx="9" fill="#22c55e" />
    <circle cx="223" cy="130" r="7" fill="#09090b" />

    <text x="18" y="180" fill="#a1a1aa" font-size="12" font-weight="500">Open Chrome extensions and switch Developer mode ON in top right corner.</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(342, 95)" filter="url(#stepShadow)">
    <rect width="275" height="240" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="275" height="40" fill="#141416" stroke="#27272a" stroke-width="1" />
    <circle cx="24" cy="20" r="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="24" y="25" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="46" y="25" fill="#fafafa" font-size="13" font-weight="700">Load Unpacked</text>

    <!-- Button illustration -->
    <rect x="18" y="55" width="239" height="85" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <rect x="30" y="70" width="130" height="34" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="95" y="91" fill="#3b82f6" font-size="12" font-weight="700" text-anchor="middle">Load unpacked</text>

    <rect x="168" y="70" width="70" height="34" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="203" y="91" fill="#71717a" font-size="11" text-anchor="middle">Pack</text>

    <text x="18" y="165" fill="#a1a1aa" font-size="12" font-weight="500">Click the &quot;Load unpacked&quot; button that appears in the top-left toolbar.</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(644, 95)" filter="url(#stepShadow)">
    <rect width="275" height="240" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="0" y="0" width="275" height="40" fill="#141416" stroke="#27272a" stroke-width="1" />
    <circle cx="24" cy="20" r="12" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1" />
    <text x="24" y="25" fill="#eab308" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="46" y="25" fill="#fafafa" font-size="13" font-weight="700">Select Folder</text>

    <!-- Folder selection illustration -->
    <rect x="18" y="55" width="239" height="85" fill="#09090b" stroke="#27272a" stroke-width="1" />
    <text x="30" y="80" fill="#71717a" font-size="11">Select directory:</text>
    <rect x="30" y="90" width="215" height="28" fill="#18181b" stroke="#22c55e" stroke-width="1" />
    <text x="40" y="108" fill="#22c55e" font-size="11" font-family="'JetBrains Mono', monospace">📁 /extension</text>

    <text x="18" y="165" fill="#a1a1aa" font-size="12" font-weight="500">Choose the cloned &quot;extension/&quot; folder. Done! Pin it to your Chrome toolbar.</text>
  </g>
</svg>
