<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" fill="none" style="background:#09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif;">
  <defs>
    <filter id="toastGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Header -->
  <rect x="0" y="0" width="960" height="42" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#eab308" />
  <circle cx="60" cy="21" r="5" fill="#22c55e" />

  <!-- Address bar -->
  <rect x="140" y="8" width="680" height="26" fill="#09090b" stroke="#27272a" stroke-width="1" />
  <text x="155" y="25" fill="#a1a1aa" font-size="12">https://www.youtube.com/watch?v=dQw4w9WgXcQ&amp;list=PLxyz987410</text>

  <!-- Extension Icon in toolbar -->
  <rect x="850" y="10" width="22" height="22" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
  <circle cx="861" cy="21" r="4" fill="#22c55e" />

  <!-- Video Player Area -->
  <rect x="0" y="42" width="960" height="478" fill="url(#screenGrad)" />

  <!-- Video Content Graphic (Modern Tech Lecture Mockup) -->
  <g transform="translate(180, 90)">
    <rect width="600" height="280" fill="#121214" stroke="#27272a" stroke-width="1" />
    
    <!-- Code Editor Mockup inside video -->
    <rect x="0" y="0" width="600" height="30" fill="#1c1c20" />
    <text x="20" y="20" fill="#71717a" font-size="11" font-family="'JetBrains Mono', monospace">src/app/page.tsx — YouTube Study Session</text>
    
    <text x="30" y="65" fill="#818cf8" font-size="13" font-family="'JetBrains Mono', monospace">export default function CourseVideo() &#123;</text>
    <text x="50" y="95" fill="#f43f5e" font-size="13" font-family="'JetBrains Mono', monospace">  const [progress, setProgress] = useState(87);</text>
    <text x="50" y="125" fill="#22c55e" font-size="13" font-family="'JetBrains Mono', monospace">  // Automatic sync triggers when progress &gt;= 85%</text>
    <text x="50" y="155" fill="#e4e4e7" font-size="13" font-family="'JetBrains Mono', monospace">  return &lt;PlaylistPredator autoSync=&#123;true&#125; /&gt;;</text>
    <text x="30" y="185" fill="#818cf8" font-size="13" font-family="'JetBrains Mono', monospace">&#125;</text>

    <!-- Watermark subtle -->
    <text x="300" y="240" fill="#27272a" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4">PLAYLIST PREDATOR</text>
  </g>

  <!-- Video Controls Overlay -->
  <g transform="translate(40, 420)">
    <!-- Progress Bar -->
    <rect x="0" y="0" width="880" height="6" fill="#3f3f46" rx="0" />
    <rect x="0" y="0" width="765" height="6" fill="#ef4444" rx="0" />
    <circle cx="765" cy="3" r="6" fill="#ef4444" />

    <!-- Playback buttons -->
    <polygon points="5,22 18,30 5,38" fill="#fafafa" />
    <rect x="35" y="22" width="4" height="16" fill="#fafafa" />
    <polygon points="45,22 55,30 45,38" fill="#fafafa" />
    <text x="80" y="34" fill="#fafafa" font-size="13">28:45 / 33:00</text>
    <text x="180" y="34" fill="#22c55e" font-size="12" font-weight="600">(87% completed • Marked Done)</text>
  </g>

  <!-- Predator Floating Toast Overlay (Authentic recreation of #predator-toast) -->
  <g transform="translate(560, 310)" filter="url(#toastGlow)">
    <rect width="360" height="96" fill="#09090b" stroke="#27272a" stroke-width="1.5" />
    <line x1="0" y1="0" x2="360" y2="0" stroke="#22c55e" stroke-width="2" />
    
    <!-- Icon box -->
    <rect x="16" y="18" width="32" height="32" fill="#22c55e" fill-opacity="0.15" />
    <text x="32" y="39" fill="#22c55e" font-size="18" font-weight="700" text-anchor="middle">✓</text>

    <!-- Text content -->
    <text x="60" y="32" fill="#fafafa" font-size="13" font-weight="700">Video marked as Done!</text>
    <text x="60" y="50" fill="#a1a1aa" font-size="11">Synced with Playlist Predator</text>
    <text x="60" y="68" fill="#22c55e" font-size="10" font-family="'JetBrains Mono', monospace">status: DONE • threshold: 85%</text>

    <!-- Dismiss close button mockup -->
    <text x="340" y="28" fill="#71717a" font-size="12" text-anchor="middle">×</text>

    <!-- Predator brand badge in toast -->
    <rect x="16" y="68" width="32" height="14" fill="#27272a" />
    <text x="32" y="79" fill="#71717a" font-size="8" text-anchor="middle">SYNC</text>
  </g>

  <!-- Callout line and pointer to Toast -->
  <g transform="translate(560, 240)">
    <rect x="-160" y="0" width="145" height="30" fill="#18181b" stroke="#22c55e" stroke-width="1" />
    <text x="-88" y="20" fill="#22c55e" font-size="11" font-weight="700" text-anchor="middle">ON-SCREEN TOAST</text>
    <path d="M -15 15 L 20 15 L 40 60" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    <circle cx="40" cy="60" r="3" fill="#22c55e" />
  </g>
</svg>
