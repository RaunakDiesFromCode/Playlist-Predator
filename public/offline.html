<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#09090b" />
        <title>Offline | Playlist Predator</title>
        <style>
            :root {
                color-scheme: dark;
            }

            html,
            body {
                margin: 0;
                min-height: 100%;
                background: #09090b;
                color: #fafafa;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            body {
                display: grid;
                place-items: center;
                padding: 24px;
            }

            main {
                width: min(100%, 420px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0px;
                background: rgba(255, 255, 255, 0.04);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
                padding: 24px;
            }

            h1 {
                margin: 0 0 12px;
                font-size: 1.5rem;
            }

            p {
                margin: 0;
                line-height: 1.5;
                color: rgba(250, 250, 250, 0.78);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>You're offline</h1>
            <p>
                Playlist Predator can reopen cached pages, but playlist analysis
                needs a connection to refresh data.
            </p>
        </main>
    </body>
</html>
